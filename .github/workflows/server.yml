name: Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - name: makeing
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: ./
    
